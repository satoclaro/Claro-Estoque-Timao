<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Modelo em HTML</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }
    h1 { font-size: 2rem; margin-bottom: 0.75rem; }
    p { color: var(--muted); margin-bottom: 1.25rem; }
    .badge {
      display: inline-block;
      background: #eff6ff;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="badge">Arquivo HTML pronto</span>
    <h1>Olá! Esta é uma página HTML de exemplo</h1>
    <p>
      Este arquivo foi gerado automaticamente e empacotado em um arquivo <strong>.zip</strong>.
      Você pode editá-lo livremente ou me pedir para criar um layout ou conteúdo específico.
    </p>
    <a class="btn" href="#topo">Voltar ao topo</a>
  </main>
</body>
</html>
